name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        run: ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Baja-pe-debug
          path: app/build/outputs/apk/debug/*universal*debug*.apk
          if-no-files-found: error
      - name: Run tests, lint and coverage
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --stacktrace testDebugUnitTest lintDebug verifyM1Coverage globalCoverageReport verifyGlobalCoverage || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --stacktrace assembleRelease
      - name: Upload M1 coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M1-URL-security-coverage
          path: app/build/reports/jacoco/m1CoverageReport/
          if-no-files-found: warn
      - name: Upload global coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-coverage
          path: app/build/reports/jacoco/globalCoverageReport/
          if-no-files-found: warn
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-schema-v2
          path: app/schemas/
          if-no-files-found: warn
  detekt:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Run Detekt
        run: ./gradlew --no-daemon :app:detekt
      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: warn
      - name: Upload SARIF
        if: always() && hashFiles('app/build/reports/detekt/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt

  android-instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 35]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM acceleration
        run: |
          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            if test -r /dev/kvm && test -w /dev/kvm; then
              echo "KVM disponible."
            else
              echo "::warning::KVM no accesible; el emulador usará software."
            fi
          else
            echo "::warning::KVM no disponible; el emulador usará software."
          fi
      - name: Android Intent security tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -s ExoPlayerImplInternal:E; exit 1; }
            [ "${{ matrix.api }}" -lt 29 ] || adb pull /sdcard/Download/music-layout.png "$GITHUB_WORKSPACE/music-layout.png"
            [ "${{ matrix.api }}" -lt 29 ] || adb pull /sdcard/Download/music-playing.png "$GITHUB_WORKSPACE/music-playing.png"
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: instrumented-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Upload music layout
        if: matrix.api >= 29
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: music-layout-api-${{ matrix.api }}
          path: |
            music-layout.png
            music-playing.png
          if-no-files-found: error





  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Generar SBOM CycloneDX
        run: ./gradlew --no-daemon cyclonedxBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyclonedx-sbom
          path: build/reports/cyclonedx/
          if-no-files-found: error

  ktlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Verificar estilo con línea base
        run: ./gradlew --no-daemon :app:ktlintCheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/
          if-no-files-found: warn

  verify-signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Crear clave temporal de prueba
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass testonly -keypass testonly -alias test -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI test"
      - name: Compilar y verificar APK firmados
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/test.keystore
          KEYSTORE_PASSWORD: testonly
          KEY_ALIAS: test
          KEY_PASSWORD: testonly
        run: |
          ./gradlew --no-daemon assembleRelease
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            # Verify x86_64 is excluded: no production Android devices use x86_64
            # (only emulators). Release APKs should only contain arm64-v8a and armeabi-v7a.
            if unzip -Z1 "$apk" | grep -q '^lib/x86_64/'; then exit 1; fi
          done
          python3 scripts/verify_native_pages.py "${apks[@]}"
