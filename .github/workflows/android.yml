name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test and build APK
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --stacktrace testDebugUnitTest lintDebug assembleDebug verifyM1Coverage globalCoverageReport || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' --stacktrace assembleRelease
      - name: Upload M1 coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M1-URL-security-coverage
          path: app/build/reports/jacoco/m1CoverageReport/
          if-no-files-found: warn
      - name: Upload global coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-coverage
          path: app/build/reports/jacoco/globalCoverageReport/
          if-no-files-found: warn
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v2
          path: app/schemas/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Baja-pe-debug
          path: app/build/outputs/apk/debug/*universal*debug*.apk
          if-no-files-found: error

  android-instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 35]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM acceleration
        run: |
          if [ -c /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            if test -r /dev/kvm && test -w /dev/kvm; then
              echo "KVM disponible."
            else
              echo "::warning::KVM no accesible; el emulador usará software."
            fi
          else
            echo "::warning::KVM no disponible; el emulador usará software."
          fi
      - name: Android Intent security tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -s ExoPlayerImplInternal:E; exit 1; }
            adb pull /sdcard/Download/music-layout.png "$GITHUB_WORKSPACE/music-layout.png"
            adb pull /sdcard/Download/music-playing.png "$GITHUB_WORKSPACE/music-playing.png"
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Upload music layout
        uses: actions/upload-artifact@v4
        with:
          name: music-layout-api-${{ matrix.api }}
          path: |
            music-layout.png
            music-playing.png
          if-no-files-found: error





  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generar SBOM CycloneDX
        run: ./gradlew --no-daemon cyclonedxBom
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/cyclonedx/
          if-no-files-found: error

  ktlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Obtener formato propuesto
        run: |
          ./gradlew --no-daemon :app:ktlintFormat || true
          echo "FORMAT_WORKER $(base64 -w 0 app/src/main/java/com/tikitoki/downloader/data/ExtractorUpdateWorker.kt)"
          echo "FORMAT_VERIFIER $(base64 -w 0 app/src/main/java/com/tikitoki/downloader/data/ExtractorVerifier.kt)"
      - name: Verificar estilo con línea base
        run: ./gradlew --no-daemon :app:ktlintCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/
          if-no-files-found: warn

  verify-signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Crear clave temporal de prueba
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass testonly -keypass testonly -alias test -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI test"
      - name: Compilar y verificar APK firmados
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/test.keystore
          KEYSTORE_PASSWORD: testonly
          KEY_ALIAS: test
          KEY_PASSWORD: testonly
        run: |
          ./gradlew --no-daemon assembleRelease
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            # Verify x86_64 is excluded: no production Android devices use x86_64
            # (only emulators). Release APKs should only contain arm64-v8a and armeabi-v7a.
            if unzip -Z1 "$apk" | grep -q '^lib/x86_64/'; then exit 1; fi
          done
