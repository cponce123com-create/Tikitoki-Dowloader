name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug verifyM1Coverage || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
      - name: Upload M1 coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M1-URL-security-coverage
          path: app/build/reports/jacoco/m1CoverageReport/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Baja-pe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-instrumented:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android Intent security tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -s ExoPlayerImplInternal:E; exit 1; }
            adb pull /sdcard/Download/music-layout.png "$GITHUB_WORKSPACE/music-layout.png"
            adb pull /sdcard/Download/music-playing.png "$GITHUB_WORKSPACE/music-playing.png"
      - name: Upload music layout
        uses: actions/upload-artifact@v4
        with:
          name: music-layout
          path: |
            music-layout.png
            music-playing.png
          if-no-files-found: error



