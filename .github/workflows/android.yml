name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test and build APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease verifyM1Coverage || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
      - name: Upload M1 coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M1-URL-security-coverage
          path: app/build/reports/jacoco/m1CoverageReport/
          if-no-files-found: warn
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v2
          path: app/schemas/
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Baja-pe-debug
          path: app/build/outputs/apk/debug/*universal*debug*.apk
          if-no-files-found: error

  android-instrumented:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Android Intent security tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -s ExoPlayerImplInternal:E; exit 1; }
            adb pull /sdcard/Download/music-layout.png "$GITHUB_WORKSPACE/music-layout.png"
            adb pull /sdcard/Download/music-playing.png "$GITHUB_WORKSPACE/music-playing.png"
      - name: Upload music layout
        uses: actions/upload-artifact@v4
        with:
          name: music-layout
          path: |
            music-layout.png
            music-playing.png
          if-no-files-found: error





  historical-room-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efff10ccbd046b3b85dcdbc82a979012e3644ca3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Exportar esquema real de Room 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          database = Path("app/src/main/java/com/tikitoki/downloader/data/DownloadDatabase.kt")
          source = database.read_text()
          assert "version = 1, exportSchema = false" in source
          database.write_text(source.replace("version = 1, exportSchema = false", "version = 1, exportSchema = true"))
          build = Path("app/build.gradle.kts")
          build.write_text(build.read_text() + '\n' + 'ksp { arg("room.schemaLocation", "$projectDir/schemas") }' + '\n')
          PY
          gradle --no-daemon :app:kspDebugKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: room-schema-v1
          path: app/schemas/
          if-no-files-found: error
