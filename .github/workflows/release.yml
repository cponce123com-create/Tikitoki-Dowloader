# Secretos de GitHub necesarios para publicar:
# KEYSTORE_BASE64: contenido completo del keystore codificado en base64.
# KEYSTORE_PASSWORD: contraseña del keystore.
# KEY_ALIAS: alias de la clave de firma.
# KEY_PASSWORD: contraseña de la clave de firma.
name: Release Android
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validar tag y CI del commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/verify_release_version.py "$GITHUB_REF_NAME"
          for workflow in android.yml license-compliance.yml dependency-check.yml; do
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$(git rev-parse HEAD)" -f branch=main -f event=push -f per_page=1 \
              --jq '.workflow_runs[0].conclusion // "sin resultado"')
            if [ "$run" != success ]; then
              echo "::error::$workflow en el commit del tag: $run"
              exit 1
            fi
          done
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.3.1'
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baja-release.keystore"
          test -s "$RUNNER_TEMP/baja-release.keystore"
          chmod 600 "$RUNNER_TEMP/baja-release.keystore"
      - name: Pruebas y release firmado
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/baja-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verificar APK y calcular sumas
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            cp "$apk" release-artifacts/
          done
          python3 scripts/verify_native_pages.py "${apks[@]}"
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-release-apks
          path: release-artifacts/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release-apks
          path: release-artifacts
      - name: Crear borrador de GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS.txt
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          test "$tag_sha" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" ./*.apk SHA256SUMS.txt --verify-tag --generate-notes --draft
