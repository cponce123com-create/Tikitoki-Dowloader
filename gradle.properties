org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Compiler daemon for faster builds
kotlin.compiler.execution.strategy=daemon

# Transitional compatibility for existing Kotlin and KSP configuration.
android.builtInKotlin=false
android.newDsl=false
ksp.useKSP2=true

# Baseline Profiles (requires AGP 8.0+)
android.baselineprofile.enabled=true

# R8 full mode (already enabled via isMinifyEnabled)
# android.r8.fullMode=true